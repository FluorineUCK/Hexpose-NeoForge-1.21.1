import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9-SNAPSHOT"
    id "org.jetbrains.kotlin.jvm" version "2.2.21"

    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge {
        platformPackage = "neoforge"
    }
}

loom {
    mods {
        // Architectury already owns the development container named "main".
        // Reusing it keeps the Kotlin classes and resources in one NeoForge
        // mod file; a second name exposes only the resource root at runtime.
        main {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // The pack supplies Kotlin at runtime through KotlinForForge. Keep the
    // standard library on the compile classpath because automatic stdlib
    // injection is deliberately disabled in gradle.properties.
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    neoForge "net.neoforged:neoforge:${project.neo_forge_version}"

    // These are already Mojmap NeoForge artifacts. Feeding them through Loom's
    // mod remapper makes it try to reinterpret Hex Casting's Mojmap access
    // widener as intermediary and corrupts the Minecraft cache.
    compileOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/paucal-${project.paucal_version}+${project.minecraft_version}-neoforge.jar")
    runtimeOnly files("libs/inline-${project.minecraft_version}-${project.inline_version}-neoforge-devruntime.jar")
    runtimeOnly files("libs/caelus-neoforge-${project.caelus_version}.jar")
    runtimeOnly files("libs/Patchouli-1.21.1-93-NEOFORGE.jar")

    modRuntimeOnly "dev.architectury:architectury-neoforge:${project.architectury_version}"
    // Inline declares Cloth Config as a mandatory client dependency.
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.130"
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.kotlin_for_forge_version}"
}

sourceSets.main.kotlin.srcDirs += "src/main/java"

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
    exclude "fabric.mod.json"
    exclude "hexpose.accesswidener"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named("sourcesJar", Jar) {
    exclude "fabric.mod.json"
    exclude "hexpose.accesswidener"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
